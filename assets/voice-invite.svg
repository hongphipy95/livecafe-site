<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="t d">
<title id="t">Gọi khách lên hát bằng giọng nói</title><desc id="d">Khi tới lượt, loa đọc to câu mời tiếng Việt kèm tên khách và tên bài, TV hiện tên người lên hát rồi đếm ngược vào bài.</desc>
<defs><linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3f3a"/><stop offset="1" stop-color="#087b70"/></linearGradient>
<radialGradient id="vglow" cx=".5" cy=".36" r=".55"><stop stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect width="900" height="690" rx="28" fill="url(#vbg)"/>
<rect width="900" height="690" rx="28" fill="url(#vglow)"/>
<text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="22" letter-spacing="3" fill="#a9d9c7" font-weight="700">TỚI LƯỢT · LOA TỰ GỌI · TV TỰ HIỆN</text>
<rect x="120" y="110" width="660" height="300" rx="24" fill="#102e2c" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
<rect x="120" y="110" width="660" height="60" rx="24" fill="#ffffff" fill-opacity=".08"/>
<circle cx="160" cy="140" r="7" fill="#ff6b6b"/><circle cx="184" cy="140" r="7" fill="#ffd66e"/><circle cx="208" cy="140" r="7" fill="#5dd39e"/>
<g transform="translate(200,250)" fill="none" stroke="#5dd39e" stroke-width="7" stroke-linecap="round">
<path d="M0 0h22v44H0z" fill="#5dd39e" stroke="none"/><path d="M22 8a22 28 0 0128 14M22 36a22 28 0 0028-14" />
<path d="M58 0a44 52 0 0138 26M58 44a44 52 0 0038-26" opacity=".65"/>
<path d="M102 -8a68 76 0 0148 38M102 52a68 76 0 0048-38" opacity=".35"/>
</g>
<text x="560" y="250" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#ffffff">“An ơi, micro</text>
<text x="560" y="296" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#ffffff">đang đợi!”</text>
<text x="560" y="344" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffd66e">Mời hát Nối Vòng Tay</text>
<rect x="120" y="440" width="660" height="110" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".3"/>
<g font-family="sans-serif" text-anchor="middle" font-size="19">
<circle cx="220" cy="478" r="14" fill="#5dd39e"/><text x="220" y="485" font-size="16" font-weight="800" fill="#06302b">1</text><text x="220" y="522" fill="#fff">Loa gọi tên</text>
<circle cx="450" cy="478" r="14" fill="#5dd39e"/><text x="450" y="485" font-size="16" font-weight="800" fill="#06302b">2</text><text x="450" y="522" fill="#fff">TV hiện lượt</text>
<circle cx="680" cy="478" r="14" fill="#ffd66e"/><text x="680" y="485" font-size="16" font-weight="800" fill="#3d2c00">3</text><text x="680" y="522" fill="#fff">Đếm ngược 6 giây</text>
</g>
<path d="M270 478h130M500 478h130" stroke="#5dd39e" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<text x="450" y="610" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#d5e9e3">Mỗi lượt một câu khác nhau · Lỗi giọng đọc không chặn bài sau</text>
<text x="450" y="642" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#a9d9c7">Đọc ngay trên máy, giọng nữ miền Nam</text>
</svg>
